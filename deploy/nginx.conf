# ============================================================
# 智慧互联管理系统 - 前端 Nginx 配置（多后端网关）
# ============================================================
# 使用说明：
#   1. npm run build:prod 打包后，将 dist 目录内容放到 root 路径
#   2. 修改下方 upstream 中的 IP/端口为内网实际后端地址
#   3. 放入 nginx conf.d/ 或 include 到 http {} 中，然后 nginx -t && nginx -s reload
#
# 前端 API 前缀（与 .env.production 中 VITE_APP_BASE_API=/prod-api 一致）：
#   /prod-api-auth/        -> 认证中心 8082
#   /prod-api-main/        -> 主系统   8081
#   /prod-api-pricing/     -> 利率定价 8083
#   /prod-api-performance/ -> 绩效考核 8084
#   /prod-api-party/       -> 党建     8085
# ============================================================

upstream ruoyi_auth {
    server 127.0.0.1:8082;
}

upstream ruoyi_main {
    server 127.0.0.1:8081;
}

upstream ruoyi_pricing {
    server 127.0.0.1:8083;
}

upstream ruoyi_performance {
    server 127.0.0.1:8084;
}

upstream ruoyi_party {
    server 127.0.0.1:8085;
}

server {
    listen       81;
    server_name  localhost;

    # dist 打包产物目录（按实际路径修改）
    root   /usr/share/nginx/html/ruoyi-vue3;
    index  index.html;

    charset utf-8;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # gzip 静态文件（build 时会生成 .gz，优先返回）
    location ~* \.(js|css)$ {
        gzip_static on;
        try_files $uri =404;
    }

    # ---------- 多后端 API 反向代理 ----------

    location /prod-api-auth/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_pass http://ruoyi_auth/;
    }

    location /prod-api-main/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        client_max_body_size  50m;
        proxy_pass http://ruoyi_main/;
    }

    location /prod-api-pricing/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        client_max_body_size  50m;
        proxy_pass http://ruoyi_pricing/;
    }

    location /prod-api-performance/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        client_max_body_size  50m;
        proxy_pass http://ruoyi_performance/;
    }

    location /prod-api-party/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_pass http://ruoyi_party/;
    }

    # ---------- SPA 前端路由（必须放在 API 之后） ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
